<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creator Script Safe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#0F766E; --teal-dark:#115E59;
    --bg:#F7F9F5; --ink:#10201F; --ink-soft:#2B3B37;
    --muted:#4B5D59; --faint:#8A9A95; --border:#DCE3DE;
    --green-bg:#E3F5E8; --green-ink:#146C38;
    --amber-bg:#FCF4D6; --amber-ink:#8A6A05;
    --red-bg:#FBE7E7; --red-ink:#B02A2A;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--teal);text-decoration:none}
  a:hover{color:var(--teal-dark)}
  .mono{font-family:'IBM Plex Mono',monospace}
  button{font-family:inherit}
  .btn-primary{display:inline-flex;align-items:center;justify-content:center;border:none;border-radius:6px;background:var(--teal);color:var(--bg);font-size:14px;font-weight:500;padding:10px 18px;cursor:pointer}
  .btn-primary:hover{background:var(--teal-dark)}
  .css-blink::after{content:"";display:inline-block;width:.5ch;height:.9em;margin-left:.15em;background:var(--teal);vertical-align:-0.12em;animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  header{position:sticky;top:0;z-index:40;background:rgba(247,249,245,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
  .wrap{max-width:1152px;margin:0 auto;padding:0 24px}
  .navbar{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500;color:var(--ink)}
  .brand-mark{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;background:var(--teal);color:var(--bg);font-size:11px}
  nav.links{display:flex;align-items:center;gap:28px;font-size:14px;color:var(--muted)}
  nav.links a{color:var(--muted)}
  .navright{display:flex;align-items:center;gap:12px}
  .langswitch{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;font-size:11px}
  .langswitch button{padding:6px 10px;background:#fff;color:var(--muted);border:none;cursor:pointer}
  .langswitch button.active{background:var(--teal);color:var(--bg)}
  .langswitch button:nth-child(2){border-left:1px solid var(--border);border-right:1px solid var(--border)}

  section{padding:0 0}
  .hero{padding:56px 24px 64px}
  .hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;row-gap:20px;align-items:start}
  .eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin:0 0 20px}
  h1{text-wrap:balance;font-size:2.6rem;line-height:1.12;font-weight:600;margin:0}
  .hero-desc{margin-top:24px;font-size:17px;line-height:1.7;color:var(--muted);max-width:46ch}

  .mockup{border-radius:8px;border:1px solid var(--border);background:#fff;box-shadow:0 1px 2px rgba(16,32,31,.04);overflow:hidden;max-width:485px}
  .mockup-tabs{display:flex;background:var(--bg);border-bottom:1px solid var(--border)}
  .mockup-tabs button{flex:1;font-size:12px;padding:10px 12px;border:none;cursor:pointer;background:transparent;color:var(--faint);transition:background .2s ease,color .2s ease}
  .mockup-tabs button.active{background:#fff;color:var(--teal);font-weight:500}
  .mockup-body{position:relative;min-height:320px}
  .panel{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .35s ease}
  .panel.active{opacity:1;pointer-events:auto}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--bg)}
  .panel-head .fname{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .flagpill{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--amber-ink)}
  .dot{width:6px;height:6px;border-radius:50%;display:inline-block}
  .review-cols{display:grid;grid-template-columns:1fr 1fr}
  .review-col{padding:18px}
  .review-col.left{border-right:1px solid var(--border)}
  .review-col.right{background:rgba(227,245,232,.4)}
  .colhead{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 0 12px}
  .flagline p{font-size:13px;line-height:1.7;color:var(--ink-soft);margin:0}
  .flagline .lnum{font-variant-numeric:tabular-nums;color:var(--faint);margin-right:8px}
  .hl-amber{background-image:linear-gradient(var(--amber-bg),var(--amber-bg));background-repeat:no-repeat;background-size:100% .5em;background-position:0 85%;text-decoration:underline;text-decoration-color:#EAB308;text-decoration-thickness:2px;text-underline-offset:3px}
  .hl-red{background-image:linear-gradient(var(--red-bg),var(--red-bg));background-repeat:no-repeat;background-size:100% .5em;background-position:0 85%;text-decoration:underline;text-decoration-color:#DC2626;text-decoration-thickness:2px;text-underline-offset:3px}
  .badge{margin-top:6px;display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px}
  .badge-amber{background:var(--amber-bg);color:var(--amber-ink)}
  .badge-red{background:var(--red-bg);color:var(--red-ink)}
  .badge-green{background:var(--green-bg);color:var(--green-ink)}
  .rewrite-block{margin-bottom:16px}
  .rewrite-block p{font-size:13px;line-height:1.7;color:var(--ink);margin:0}
  .rewrite-meta{margin-top:6px;display:flex;align-items:center;gap:8px}
  .copylink{font-size:11px;color:var(--teal);background:none;border:none;cursor:pointer;text-decoration:underline;text-underline-offset:2px;padding:0}
  .create-panel-body{padding:18px}
  .arrow-row{margin:10px 0;display:flex;align-items:center;gap:6px;color:var(--faint);font-size:11px}
  .create-note-row{margin-top:10px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .create-note-row span.note{font-size:12px;line-height:1.6;color:var(--muted)}

  #workflow{border-top:1px solid var(--border)}
  .section-pad{padding:64px 24px 80px}
  h2{text-wrap:balance;font-size:1.75rem;font-weight:600;margin:0;max-width:32ch}
  .steps{margin-top:48px;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
  .step{display:grid;grid-template-columns:2.5rem 1fr;gap:20px;padding:36px 0;border-bottom:1px solid var(--border)}
  .step:last-child{border-bottom:none}
  .step-num{font-size:14px;color:var(--faint)}
  .step-inner{display:grid;grid-template-columns:1fr 1fr;gap:40px}
  .step-inner.center{align-items:center}
  .step h3{font-size:18px;font-weight:600;margin:0}
  .step p.desc{margin-top:8px;font-size:15px;line-height:1.7;color:var(--muted);max-width:42ch}
  .tag{font-size:12px;padding:4px 10px;border-radius:6px;border:1px solid var(--border);color:var(--muted)}
  .tagrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .demo-card{border-radius:8px;border:1px solid var(--border);background:#fff;padding:16px;max-width:485px}
  .demo-card p{font-size:13px;margin:0;color:var(--ink-soft)}
  .demo-card p.out{color:var(--ink)}
  .grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:485px}
  .minicard{border-radius:6px;border:1px solid var(--border);background:#fff;padding:10px 12px}
  .minicard .t{font-size:11px;text-transform:uppercase;letter-spacing:.1em;margin:0}
  .minicard .d{margin-top:4px;font-size:12px;color:var(--muted)}
  .btn-outline{margin-top:16px;display:inline-flex;align-items:center;border-radius:6px;border:1px solid var(--border);color:var(--ink);font-size:12px;font-weight:500;padding:8px 14px;background:none;cursor:pointer}
  ul.bullets{font-size:13px;color:var(--muted);margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
  ul.bullets li{display:flex;align-items:flex-start;gap:8px}
  ul.bullets li::before{content:"";margin-top:6px;width:4px;height:4px;border-radius:50%;background:var(--teal);flex-shrink:0}

  #use-cases{border-top:1px solid var(--border);background:rgba(255,255,255,.6)}
  .uc-grid{margin-top:40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .uc-card{border-radius:8px;border:1px solid var(--border);background:var(--bg);padding:20px}
  .uc-card h3{font-size:14px;font-weight:600;margin:0}
  .uc-card p{margin-top:6px;font-size:13px;line-height:1.7;color:var(--muted)}

  #note{border-top:1px solid var(--border)}
  .disclaimer-box{border-radius:8px;border:1px solid var(--border);background:rgba(227,245,232,.4);padding:26px 32px}
  .disclaimer-box p.txt{font-size:14px;line-height:1.7;color:var(--ink-soft);margin:0}

  footer{border-top:1px solid var(--border)}
  .footwrap{max-width:1152px;margin:0 auto;padding:40px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
  .foottag{font-size:12px;color:var(--faint);line-height:1.7;margin:0}
  .foot-brand{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
  .foot-brand .brand-mark{width:24px;height:24px;font-size:10px}

  /* ---------- Modal ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(16,32,31,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:1000}
  .modal-overlay.open{display:flex}
  .modal{width:100%;max-width:560px;background:#fff;border-radius:10px;border:1px solid var(--border);box-shadow:0 20px 60px rgba(16,32,31,.25);overflow:hidden}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border)}
  .modal-head h3{margin:0;font-size:16px;font-weight:600}
  .modal-close{border:none;background:none;cursor:pointer;font-size:18px;color:var(--faint);line-height:1;padding:4px}
  .modal-close:hover{color:var(--ink)}
  .modal-body{padding:20px 22px}
  .modal-body label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin-bottom:8px}
  .modal-body textarea{width:100%;min-height:150px;resize:vertical;border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-size:14px;line-height:1.6;font-family:inherit;color:var(--ink);background:var(--bg)}
  .modal-body textarea:focus{outline:2px solid var(--teal);outline-offset:1px}
  .modal-hint{margin-top:8px;font-size:12px;color:var(--faint)}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--border)}
  .btn-ghost{background:none;border:1px solid var(--border);border-radius:6px;padding:9px 16px;font-size:14px;color:var(--muted);cursor:pointer}
  .btn-ghost:hover{color:var(--ink)}
  .btn-submit{border:none;border-radius:6px;background:var(--teal);color:var(--bg);font-size:14px;font-weight:500;padding:9px 18px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
  .btn-submit:disabled{opacity:.6;cursor:not-allowed}
  .spinner{width:14px;height:14px;border-radius:50%;border:2px solid rgba(247,249,245,.5);border-top-color:#fff;animation:spin .7s linear infinite;display:none}
  .spinner.show{display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}
  .result-box{margin-top:16px;border-radius:8px;border:1px solid var(--border);background:var(--bg);padding:14px 16px;font-size:13px;line-height:1.7;color:var(--ink-soft);white-space:pre-wrap;display:none}
  .result-box.show{display:block}
  .result-box.error{border-color:#F1B4B4;background:var(--red-bg);color:var(--red-ink)}
</style>
</head>
<body>

<header>
  <div class="wrap navbar">
    <a href="#main" class="brand"><span class="brand-mark mono">[//]</span>Creator Script Safe</a>
    <nav class="links">
      <a href="#workflow" data-i18n="navWorkflow"></a>
      <a href="#use-cases" data-i18n="navUseCases"></a>
      <a href="#note" data-i18n="navAbout"></a>
    </nav>
    <div class="navright">
      <div class="langswitch mono">
        <button type="button" data-lang="zh">简体中文</button>
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="es">ES</button>
      </div>
      <button type="button" class="btn-primary js-open-modal" data-i18n="ctaCheck"></button>
    </div>
  </div>
</header>

<main id="main">

  <section class="hero">
    <div class="wrap hero-grid">
      <div>
        <p class="eyebrow mono" data-i18n="heroEyebrow"></p>
        <h1><span data-i18n="heroTitle"></span><span class="css-blink"></span></h1>
        <p class="hero-desc" data-i18n="heroDesc"></p>
        <button type="button" class="btn-primary js-open-modal" style="margin-top:32px" data-i18n="ctaCheck"></button>
      </div>

      <div class="mockup">
        <div class="mockup-tabs">
          <button type="button" class="tab-review active" data-tab="review" data-i18n="tabReviewLabel"></button>
          <button type="button" class="tab-create" data-tab="create" data-i18n="tabCreateLabel"></button>
        </div>
        <div class="mockup-body">
          <div class="panel active" data-panel="review">
            <div class="panel-head">
              <span class="fname mono" data-i18n="mockupFilename"></span>
              <span class="flagpill mono"><span class="dot" style="background:#EAB308"></span><span data-i18n="mockupFlags"></span></span>
            </div>
            <div class="review-cols">
              <div class="review-col left">
                <p class="colhead mono" data-i18n="originalLabel"></p>
                <div class="flagline" style="margin-bottom:16px">
                  <p><span class="lnum mono">L12</span><span data-i18n="l12Pre"></span> <span class="hl-amber" data-i18n="l12Mid"></span><span data-i18n="l12Post"></span></p>
                  <span class="badge badge-amber mono" data-i18n="l12Badge"></span>
                </div>
                <div class="flagline">
                  <p><span class="lnum mono">L14</span><span data-i18n="l14Pre"></span> <span class="hl-red" data-i18n="l14Mid"></span><span data-i18n="l14Post"></span></p>
                  <span class="badge badge-red mono" data-i18n="l14Badge"></span>
                </div>
              </div>
              <div class="review-col right">
                <p class="colhead mono" data-i18n="rewriteLabel"></p>
                <div class="rewrite-block">
                  <p data-i18n="rewrite1"></p>
                  <div class="rewrite-meta">
                    <span class="badge badge-green mono" data-i18n="safeBadge"></span>
                    <button type="button" class="copylink mono js-copy" data-copy-key="rewrite1" data-btn-key="copyButtonText1"></button>
                  </div>
                </div>
                <div class="rewrite-block" style="margin-bottom:0">
                  <p data-i18n="rewrite2"></p>
                  <div class="rewrite-meta">
                    <span class="badge badge-green mono" data-i18n="safeBadge"></span>
                    <button type="button" class="copylink mono js-copy" data-copy-key="rewrite2" data-btn-key="copyButtonText2"></button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="panel" data-panel="create">
            <div class="panel-head">
              <span class="fname mono" data-i18n="createFilename"></span>
              <span class="flagpill mono" style="color:var(--green-ink)"><span class="dot" style="background:#16A34A"></span><span data-i18n="createBadge"></span></span>
            </div>
            <div class="create-panel-body">
              <p class="colhead mono" data-i18n="createInputLabel"></p>
              <p data-i18n="createInputText"></p>
              <div class="arrow-row mono"><span data-i18n="createArrow"></span></div>
              <p class="colhead mono" data-i18n="createOutputLabel"></p>
              <p data-i18n="createOutputText"></p>
              <div class="create-note-row">
                <span class="badge badge-green mono" data-i18n="safeBadge"></span>
                <span class="note" data-i18n="createNote"></span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section id="workflow">
    <div class="wrap section-pad">
      <p class="eyebrow mono" data-i18n="workflowEyebrow"></p>
      <h2 data-i18n="workflowHeading"></h2>

      <div class="steps">
        <div class="step">
          <div class="step-num mono">L01</div>
          <div class="step-inner">
            <div>
              <h3 data-i18n="l01Title"></h3>
              <p class="desc" data-i18n="l01Desc"></p>
            </div>
            <div class="tagrow">
              <span class="tag mono" data-i18n="tagHooks"></span>
              <span class="tag mono" data-i18n="tagCaptions"></span>
              <span class="tag mono" data-i18n="tagTalkingPoints"></span>
              <span class="tag mono" data-i18n="tagClaims"></span>
              <span class="tag mono" data-i18n="tagCtas"></span>
              <span class="tag mono" data-i18n="tagQa"></span>
            </div>
          </div>
        </div>

        <div class="step">
          <div class="step-num mono">L02</div>
          <div class="step-inner center">
            <div>
              <h3 data-i18n="genTitle"></h3>
              <p class="desc" data-i18n="genDesc"></p>
            </div>
            <div class="demo-card">
              <p data-i18n="genInput"></p>
              <div class="arrow-row mono"><span data-i18n="genArrow"></span></div>
              <p class="out" data-i18n="genOutput"></p>
            </div>
          </div>
        </div>

        <div class="step">
          <div class="step-num mono">L03</div>
          <div class="step-inner center">
            <div>
              <h3 data-i18n="l02Title"></h3>
              <p class="desc" data-i18n="l02Desc"></p>
            </div>
            <div class="demo-card">
              <p><span class="hl-red" data-i18n="l02Original"></span></p>
              <div class="arrow-row mono"><span data-i18n="rewrittenArrow"></span></div>
              <p class="out" data-i18n="l02Rewritten"></p>
            </div>
          </div>
        </div>

        <div class="step">
          <div class="step-num mono">L04</div>
          <div class="step-inner">
            <div>
              <h3 data-i18n="l03Title"></h3>
              <p class="desc" data-i18n="l03Desc"></p>
            </div>
            <div class="grid4">
              <div class="minicard"><p class="t mono" style="color:var(--green-ink)" data-i18n="phraseBankTitle"></p><p class="d" data-i18n="phraseBankDesc"></p></div>
              <div class="minicard"><p class="t mono" style="color:var(--red-ink)" data-i18n="avoidListTitle"></p><p class="d" data-i18n="avoidListDesc"></p></div>
              <div class="minicard"><p class="t mono" style="color:var(--teal)" data-i18n="backupTitle"></p><p class="d" data-i18n="backupDesc"></p></div>
              <div class="minicard"><p class="t mono" style="color:var(--amber-ink)" data-i18n="recoveryTitle"></p><p class="d" data-i18n="recoveryDesc"></p></div>
            </div>
          </div>
        </div>

        <div class="step">
          <div class="step-num mono">L05</div>
          <div class="step-inner center">
            <div>
              <h3 data-i18n="l04Title"></h3>
              <p class="desc" data-i18n="l04Desc"></p>
              <button type="button" class="btn-outline js-copy-static" data-copy-text="Review exported." data-btn-key="l04Button"></button>
            </div>
            <ul class="bullets">
              <li data-i18n="l04li1"></li>
              <li data-i18n="l04li2"></li>
              <li data-i18n="l04li3"></li>
              <li data-i18n="l04li4"></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section id="use-cases">
    <div class="wrap section-pad">
      <p class="eyebrow mono" data-i18n="useCasesEyebrow"></p>
      <h2 data-i18n="useCasesHeading" style="max-width:36ch"></h2>
      <div class="uc-grid">
        <div class="uc-card"><h3 data-i18n="uc1Title"></h3><p data-i18n="uc1Desc"></p></div>
        <div class="uc-card"><h3 data-i18n="uc2Title"></h3><p data-i18n="uc2Desc"></p></div>
        <div class="uc-card"><h3 data-i18n="uc3Title"></h3><p data-i18n="uc3Desc"></p></div>
        <div class="uc-card"><h3 data-i18n="uc4Title"></h3><p data-i18n="uc4Desc"></p></div>
        <div class="uc-card"><h3 data-i18n="uc5Title"></h3><p data-i18n="uc5Desc"></p></div>
        <div class="uc-card"><h3 data-i18n="uc6Title"></h3><p data-i18n="uc6Desc"></p></div>
        <div class="uc-card"><h3 data-i18n="uc7Title"></h3><p data-i18n="uc7Desc"></p></div>
        <div class="uc-card"><h3 data-i18n="uc8Title"></h3><p data-i18n="uc8Desc"></p></div>
      </div>
    </div>
  </section>

  <section id="note">
    <div class="wrap" style="padding:56px 24px 64px">
      <div class="disclaimer-box">
        <p class="eyebrow mono" style="margin-bottom:8px" data-i18n="disclaimerEyebrow"></p>
        <p class="txt" data-i18n="disclaimerText"></p>
      </div>
    </div>
  </section>

</main>

<footer>
  <div class="footwrap">

/* ============================================================
   i18n rendering
   ============================================================ */
let currentLang = 'en';

function applyLang(lang){
  currentLang = lang;
  const t = TRANSLATIONS[lang] || TRANSLATIONS.en;
  document.documentElement.lang = lang;

  document.querySelectorAll('[data-i18n]').forEach(function(el){
    const key = el.getAttribute('data-i18n');
    if (t[key] !== undefined) el.textContent = t[key];
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el){
    const key = el.getAttribute('data-i18n-placeholder');
    if (t[key] !== undefined) el.setAttribute('placeholder', t[key]);
  });
  document.querySelectorAll('.js-copy').forEach(function(el){
    const btnKey = el.getAttribute('data-btn-key');
    if (t[btnKey] !== undefined) el.textContent = t[btnKey];
  });
  document.querySelectorAll('.js-copy-static').forEach(function(el){
    const btnKey = el.getAttribute('data-btn-key');
    if (t[btnKey] !== undefined) el.textContent = t[btnKey];
  });

  document.querySelectorAll('.langswitch button').forEach(function(btn){
    btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
  });
}

document.querySelectorAll('.langswitch button').forEach(function(btn){
  btn.addEventListener('click', function(){ applyLang(btn.getAttribute('data-lang')); });
});

/* ============================================================
   Mockup tab switching
   ============================================================ */
document.querySelectorAll('.mockup-tabs button').forEach(function(btn){
  btn.addEventListener('click', function(){
    const which = btn.getAttribute('data-tab');
    document.querySelectorAll('.mockup-tabs button').forEach(function(b){ b.classList.toggle('active', b === btn); });
    document.querySelectorAll('.panel').forEach(function(p){ p.classList.toggle('active', p.getAttribute('data-panel') === which); });
  });
});

/* ============================================================
   Copy-to-clipboard buttons
   ============================================================ */
function flashCopied(el, btnKey){
  const original = TRANSLATIONS[currentLang][btnKey] || TRANSLATIONS.en[btnKey];
  el.textContent = 'Copied';
  setTimeout(function(){ el.textContent = original; }, 1400);
}
document.querySelectorAll('.js-copy').forEach(function(btn){
  btn.addEventListener('click', function(){
    const key = btn.getAttribute('data-copy-key');
    const text = TRANSLATIONS.en[key];
    if (navigator.clipboard) navigator.clipboard.writeText(text).catch(function(){});
    flashCopied(btn, btn.getAttribute('data-btn-key'));
  });
});
document.querySelectorAll('.js-copy-static').forEach(function(btn){
  btn.addEventListener('click', function(){
    const text = btn.getAttribute('data-copy-text');
    if (navigator.clipboard) navigator.clipboard.writeText(text).catch(function(){});
    flashCopied(btn, btn.getAttribute('data-btn-key'));
  });
});

function openModal(){
  overlay.classList.add('open');
  resultBox.classList.remove('show', 'error');
  resultBox.textContent = '';
  textarea.value = '';
  document.body.style.overflow = 'hidden';
  setTimeout(function(){ textarea.focus(); }, 50);
}
function closeModal(){
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}

document.querySelectorAll('.js-open-modal').forEach(function(btn){
  btn.addEventListener('click', openModal);
});
document.getElementById('csModalClose').addEventListener('click', closeModal);
document.getElementById('csModalCancel').addEventListener('click', closeModal);
overlay.addEventListener('click', function(e){ if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && overlay.classList.contains('open')) closeModal(); });

async function submitToBackend(){
  const t = TRANSLATIONS[currentLang];
  const text = textarea.value.trim();

  resultBox.classList.remove('show', 'error');

  if (!text){
    resultBox.textContent = t.modalErrorEmpty;
    resultBox.classList.add('show', 'error');
    return;
  }

  submitBtn.disabled = true;
  spinner.classList.add('show');
  submitLabel.textContent = t.modalSubmitting;

  try {
    const headers = { 'Content-Type': 'application/json' };
    if (CONFIG.apiKey) headers['Authorization'] = 'Bearer ' + CONFIG.apiKey;

    const body = {
      script: text,
      metadata: {
        platform: 'tiktok',
        surface: 'short_video',
        market: 'US',
        language: currentLang === 'zh' ? 'zh-CN' : currentLang,
        category: 'beauty',
        commerce: true,
        sponsorship: null,
        claim_evidence: null,
        audience_age: ''
      },
      force_full_review: false,
      auto_rewrite: true
    };

    const res = await fetch(CONFIG.apiUrl, {
      method: 'POST',
      headers: headers,
      body: JSON.stringify(body),
    });

    if (!res.ok) throw new Error('HTTP ' + res.status);

    const data = await res.json();
    const output = formatWorkflowResult(data);

    resultBox.textContent = output;
    resultBox.classList.add('show');
  } catch (err) {
    console.error('[Creator Script Safe] request failed:', err);
    resultBox.textContent = t.modalErrorNetwork;
    resultBox.classList.add('show', 'error');
  } finally {
    submitBtn.disabled = false;
    spinner.classList.remove('show');
    submitLabel.textContent = t.modalSubmit;
  }
}

submitBtn.addEventListener('click', submitToBackend);

function formatWorkflowResult(data){
  if (!data || typeof data !== 'object') return String(data || '');

  const lines = [];
  lines.push('Decision: ' + (data.decision || 'unknown'));

  if (data.input_classification && data.input_classification.input_type) {
    lines.push('Input: ' + data.input_classification.input_type + ' (' + data.input_classification.confidence + ')');
  }
  if (data.layer1 && data.layer1.result) {
    lines.push('Layer 1: ' + data.layer1.result);
  }
  if (data.layer2 && data.layer2.risk_level) {
    lines.push('Layer 2: ' + data.layer2.risk_level + ' (' + data.layer2.routing + ')');
  }
  if (data.missing_context && data.missing_context.length) {
    lines.push('Missing context: ' + data.missing_context.join(', '));
  }
  if (data.rewritten_text) {
    lines.push('');
    lines.push('Local rewrite:');
    lines.push(data.rewritten_text);
  }
  if (data.response) {
    lines.push('');
    lines.push(data.response);
  }
  if (data.skill_handoff_prompt) {
    lines.push('');
    lines.push('Full review is recommended. The server generated a Skill handoff prompt.');
  }

  return lines.join('\n');
}
